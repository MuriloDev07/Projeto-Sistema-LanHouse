services:
  banco_dados:
    image: postgres:15-alpine
    container_name: taciana_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taciana_net

  api:
    build: .
    container_name: taciana_api
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@banco_dados:5432/${DB_NAME}
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      banco_dados:
        condition: service_healthy
    networks:
      - taciana_net

  redis:
    image: redis:7-alpine
    container_name: taciana_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - taciana_net

volumes:
  pgdata:

networks:
  taciana_net:
    driver: bridge