Atualiza um servico
---
tags:
  - Servicos
security:
  - CookieAuth: []
parameters:
  - name: servico_id
    in: path
    type: integer
    required: true
    description: ID numérico do servico cadastrado no PostgreSQL
  - name: body
    in: body
    required: true
    description: Dados para atualização do servico
    schema:
      type: object
      required: 
        - nome
        - grupo
        - preco
      properties:
        nome:
          type: string
          example: "Impressão"
        preco:
          type: string
          example: "10.00"
        grupo:
          type: string
          example: "Impressões"
        observacao:
          type: string
          description: "Informação opcional sobre o atendimento ou cobrança"
          example: "Valor por folha"
responses:
  200:
    description: Servico atualizado com sucesso no banco
    schema:
      type: object
      properties:
        mensagem:
          type: string
          example: "Servico atualizado com sucesso"
        servico:
          type: object
          properties:
            id:
              type: integer
              example: 1
            nome:
              type: string
              example: "Impressão"
            grupo:
              type: string
              example: "Impressões"
            preco:
              type: string
              example: "10.00"
            observacao:
              type: string
              nullable: true
              example: "Valor por folha"
  400:
    description: Erro de validação ou servico duplicado
    schema:
      type: object
      properties:
        erro:
          type: string
          example: "Falha na validação ao atualizar Servico ID"
  401:
    description: Token JWT ausente ou não autorizado
    schema:
      type: object
      properties:
        msg:
          type: string
          example: "Missing Authorization Header"
  404:
    description: Servico não encontrado no banco
    schema:
      type: object
      properties:
        erro:
          type: string
          example: "Servico não encontrado"
  500:
    description: Erro interno no servidor