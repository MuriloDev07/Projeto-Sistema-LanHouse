Busca um produto específico pelo seu ID
---
tags:
  - Produtos
parameters:
  - name: produto_id
    in: path
    type: integer
    required: true
    description: ID numérico do produto cadastrado no PostgreSQL
responses:
  200:
    description: Produto retornado com sucesso
    schema:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: "Cabo de Carregador"
        preco:
          type: number
          format: float
          example: 15.00
        quantidade:
          type: integer
          example: 15
        categoria_id:
          type: integer
          example: 2
  404:
    description: Produto não encontrado no banco de dados
    schema:
      type: object
      properties:
        erro:
          type: string
          example: "Produto não encontrado"
  500:
    description: Erro interno no servidor