{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">
            <i class="bi bi-tags me-2 text-primary"></i>Gerenciamento de Categorias
        </h2>
        <!-- Botão para abrir o Modal de Cadastro -->
        <button type="button" class="btn btn-primary fw-bold" data-bs-toggle="modal" data-bs-target="#categoriaModal">
            <i class="bi bi-plus-lg me-1"></i> Nova Categoria
        </button>
    </div>

    <!-- Tabela de Categorias -->
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" class="ps-4">ID</th>
                            <th scope="col">Nome da Categoria</th>
                            <th scope="col" class="text-end pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCategorias">
                        <!-- Linhas geradas via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal de Cadastro de Categoria -->
<div class="modal fade" id="categoriaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold" id="modalTitle">Cadastrar Categoria</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="formCategoria">
                <div class="modal-body">
                    <div id="modalAlertMessage" class="alert d-none" role="alert"></div>
                    <div class="mb-3">
                        <label for="nomeCategoria" class="form-label font-monospace fs-6">Nome</label>
                        <input type="text" class="form-control" id="nomeCategoria" placeholder="Ex: Bebidas, Snacks, Horas de Uso" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary fw-bold">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Função para buscar e listar as categorias na tabela
async function carregarCategorias() {
    const tbody = document.getElementById('tabelaCategorias');
    
    try {
        // Faz a requisição à rota da API JSON
        const response = await fetch('/categorias');
        const data = await response.json();

        if (response.ok) {
            tbody.innerHTML = ''; 
            
            // A tua API devolve { mensagem: "...", categorias: [...] }
            const categorias = data.categorias || [];
            
            if (categorias.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" class="text-center text-muted py-4">Nenhuma categoria cadastrada.</td>
                    </tr>`;
                return;
            }

            categorias.forEach(cat => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="ps-4 fw-bold text-secondary">#${cat.id}</td>
                    <td class="fw-semibold">${cat.nome}</td>
                    <td class="text-end pe-4">
                        <button class="btn btn-sm btn-outline-danger" onclick="deletarCategoria(${cat.id})">
                            <i class="bi bi-trash"></i> Excluir
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    } catch (error) {
        console.error('Erro ao carregar categorias:', error);
    }
}

// Submeter o formulário de cadastro (POST /categorias)
document.getElementById('formCategoria').addEventListener('submit', async function(event) {
    event.preventDefault();
    
    const nomeInput = document.getElementById('nomeCategoria').value;
    const alertBox = document.getElementById('modalAlertMessage');

    try {
        const response = await fetch('/categorias', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin', // Envia os cookies HTTP-Only de sessão
            body: JSON.stringify({ nome: nomeInput })
        });

        const data = await response.json();

        if (response.ok) {
            document.getElementById('nomeCategoria').value = '';
            const modalElement = document.getElementById('categoriaModal');
            const modal = bootstrap.Modal.getInstance(modalElement);
            modal.hide();

            carregarCategorias();
        } else {
            alertBox.className = 'alert alert-danger';
            // Exibe a mensagem real retornada pela API (ex: erro de permissão ou de validação Marshmallow)
            alertBox.innerText = data.erro || data.msg || JSON.stringify(data);
            alertBox.classList.remove('d-none');
        }
    } catch (error) {
        alertBox.className = 'alert alert-danger';
        alertBox.innerText = 'Erro de conexão com o servidor.';
        alertBox.classList.remove('d-none');
    }
});

// Executa a busca assim que o HTML estiver completamente carregado
document.addEventListener('DOMContentLoaded', carregarCategorias);

// Função para remover uma categoria (DELETE /categorias/<id>)
async function deletarCategoria(id) {
    if (!confirm('Tem certeza que deseja excluir esta categoria?')) {
        return;
    }

    try {
        const response = await fetch(`/categorias/${id}`, {
            method: 'DELETE',
            credentials: 'same-origin' // Envia o cookie HTTP-Only de Admin
        });

        const data = await response.json();

        if (response.ok) {
            carregarCategorias(); // Recarrega a tabela após a exclusão
        } else {
            alert(data.erro || data.msg || 'Erro ao excluir categoria.');
        }
    } catch (error) {
        console.error('Erro de conexão ao excluir:', error);
        alert('Erro de conexão com o servidor.');
    }
}
</script>
{% endblock %}
